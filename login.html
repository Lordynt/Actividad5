<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema - Iniciar sesión</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- CSS propio -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-wrapper">
    <div class="login-card">

      <div class="login-brand">
        <i class="bi bi-mortarboard-fill"></i>
        <h1>Sistema Escolar</h1>
        <p>Ingresa con tu cuenta para continuar</p>
      </div>

      <div id="alertaLogin" class="alert alert-danger d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="alertaTexto"></span>
      </div>

      <form id="formLogin" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario o correo</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="usuario" autocomplete="username" required>
            <div class="invalid-feedback">Escribe tu usuario o correo.</div>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary" type="button" id="btnVerPassword" aria-label="Mostrar contraseña">
              <i class="bi bi-eye"></i>
            </button>
            <div class="invalid-feedback">Escribe tu contraseña.</div>
          </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
        </button>
      </form>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS propio -->
  <script src="js/login.js"></script>
</body>
</html>
