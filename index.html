<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema - Inicio</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- CSS propio -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top px-3" id="mainNavbar">
    <button class="btn btn-outline-light me-3" id="btnHamburguesa">
      <i class="bi bi-list"></i>
    </button>
    <a class="navbar-brand" href="#">Sistema Escolar</a>

    <div class="ms-auto dropdown">
      <button class="btn btn-dark dropdown-toggle d-flex align-items-center gap-2"
              type="button" id="dropdownUsuario" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle fs-5"></i>
        <span id="nombreUsuarioNav">Usuario</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownUsuario">
        <li><a class="dropdown-item" href="#" id="btnSalir">
          <i class="bi bi-box-arrow-right me-2"></i>Salir del sistema
        </a></li>
      </ul>
    </div>
  </nav>

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar bg-secondary text-white" id="sidebar">
    <div class="sidebar-header p-3 border-bottom border-dark">
      <h5 class="mb-0"><i class="bi bi-mortarboard-fill me-2"></i>Menú</h5>
    </div>

    <ul class="nav flex-column mt-2">
      <li class="nav-item">
        <a class="nav-link text-white" href="#">
          <i class="bi bi-house-door me-2"></i>Inicio
        </a>
      </li>

      <!-- USUARIOS con submenú -->
      <li class="nav-item">
        <a class="nav-link text-white d-flex justify-content-between align-items-center"
           data-bs-toggle="collapse" href="#submenuUsuarios" role="button">
          <span><i class="bi bi-people me-2"></i>Usuarios</span>
          <i class="bi bi-chevron-down"></i>
        </a>
        <div class="collapse" id="submenuUsuarios">
          <ul class="nav flex-column ms-3">
            <li class="nav-item">
              <a class="nav-link text-white-50" href="#" id="linkCaptura">
                <i class="bi bi-pencil-square me-2"></i>Captura
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </aside>

  <!-- ================= CONTENIDO PRINCIPAL ================= -->
  <main class="content" id="content">
    <div class="container-fluid pt-3">

      <!-- SECCIÓN BIENVENIDA (visible por defecto) -->
      <section id="seccionBienvenida">
        <h2>Bienvenido al sistema</h2>
        <p class="text-muted">Selecciona una opción del menú lateral para comenzar.</p>
      </section>

      <!-- SECCIÓN CAPTURA DE ALUMNOS (oculta al inicio) -->
      <section id="seccionCaptura" class="d-none">
        <h2 class="mb-4">Captura de Alumnos</h2>

        <form id="formAlumno" class="row g-3 needs-validation" novalidate>
          <div class="col-md-6">
            <label for="nombreAlumno" class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" id="nombreAlumno" required>
            <div class="invalid-feedback">Ingresa un nombre válido.</div>
          </div>

          <div class="col-md-6">
            <label for="correoAlumno" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correoAlumno" required>
            <div class="invalid-feedback">Correo inválido.</div>
          </div>

          <div class="col-md-6">
            <label for="passwordAlumno" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="passwordAlumno" required>
            <div class="invalid-feedback">Contraseña inválida.</div>
          </div>

          <div class="col-md-6">
            <label for="numControl" class="form-label">Número de control</label>
            <input type="text" class="form-control" id="numControl"
                   maxlength="6" pattern="\d{6}" required>
            <div class="invalid-feedback">Debe tener exactamente 6 dígitos.</div>
          </div>

          <div class="col-12">
            <button class="btn btn-primary" type="submit">
              <i class="bi bi-save me-1"></i>Guardar alumno
            </button>
          </div>
        </form>
      </section>

    </div>
  </main>

  <!-- ================= MODAL EDAD ================= -->
  <div class="modal fade" id="modalEdad" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Resultado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalEdadBody">
          <!-- Se rellena con JS -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Librería del profesor (utileria.js) -->
  <script src="https://cdn.jsdelivr.net/gh/Lordynt/Actividad2/js/utileria.js"></script>
  <!-- JS propio -->
  <script src="js/index.js"></script>
</body>
</html>
